<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holiday Maker – flöde och kod</title>
<style>
:root {
  --bg: #ffffff; --panel: #f6f7f9; --text: #1a1a18; --muted: #5f6368; --line: #c9ccd1;
  --accent: #2f6df6; --accent-soft: #e6eefe; --warn: #b8860b; --warn-soft: #fff7e0;
  --err: #c0392b; --err-soft: #fdecec; --code-bg: #fbfbfc; --hl: #fff3bf;
  --c-kw: #0b55c8; --c-str: #a3320b; --c-com: #5d7a5d; --c-sql: #7a3e9d; --c-par: #b8002e; --c-num: #0e7c6b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16181c; --panel: #1e2126; --text: #e8e8e6; --muted: #a2a6ad; --line: #3a3f47;
    --accent: #5b8cff; --accent-soft: #223050; --warn: #e0b040; --warn-soft: #3a3118;
    --err: #ff7b6b; --err-soft: #40201d; --code-bg: #1a1c21; --hl: #4a4116;
    --c-kw: #7fb0ff; --c-str: #f0a37f; --c-com: #86a886; --c-sql: #cf9cf0; --c-par: #ff8fa8; --c-num: #6fd6c4;
  }
}
:root[data-theme="dark"] {
  --bg: #16181c; --panel: #1e2126; --text: #e8e8e6; --muted: #a2a6ad; --line: #3a3f47;
  --accent: #5b8cff; --accent-soft: #223050; --warn: #e0b040; --warn-soft: #3a3118;
  --err: #ff7b6b; --err-soft: #40201d; --code-bg: #1a1c21; --hl: #4a4116;
  --c-kw: #7fb0ff; --c-str: #f0a37f; --c-com: #86a886; --c-sql: #cf9cf0; --c-par: #ff8fa8; --c-num: #6fd6c4;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 "Segoe UI", system-ui, Arial, sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header h1 { font-size: 18px; margin: 0; font-weight: 600; }
header .hint { color: var(--muted); font-size: 13px; flex: 1; min-width: 200px; }
button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button:focus-visible, .node:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); height: calc(100% - 55px); }
#chart { padding: 12px 16px; overflow: auto; border-right: 1px solid var(--line); }
#chart svg { width: 100%; height: auto; display: block; font: 12px "Segoe UI", system-ui, Arial, sans-serif; }
#panel { padding: 16px 20px 40px; overflow: auto; }
.ln { stroke: var(--muted); stroke-width: 1.5; }
#arr path { fill: var(--muted); }
.lbl { fill: var(--muted); font-size: 11px; }
.node { cursor: pointer; }
.node rect, .node polygon { fill: var(--bg); stroke: var(--muted); stroke-width: 1.5; transition: fill .1s; }
.node text { fill: var(--text); pointer-events: none; }
.node:hover rect, .node:hover polygon { stroke: var(--accent); stroke-width: 2.5; }
.k-pill rect, .k-bar rect, .k-note rect { fill: var(--panel); }
.k-note rect { stroke-dasharray: 5 4; }
.k-head rect { fill: var(--accent); stroke: var(--accent); }
.k-head text { fill: #ffffff; font-weight: 600; }
.k-diamond polygon { fill: var(--warn-soft); stroke: var(--warn); }
.k-error rect { fill: var(--err-soft); stroke: var(--err); }
.node.sel rect, .node.sel polygon { stroke: var(--accent); stroke-width: 4; fill: var(--accent-soft); }
.k-head.sel rect { fill: var(--accent); stroke: var(--text); }
.node.sel text { font-weight: 600; }
#panel h2 { font-size: 22px; margin: 0 0 6px; }
.say { background: var(--accent-soft); border-left: 4px solid var(--accent); padding: 10px 14px; border-radius: 4px; margin: 10px 0 18px; font-size: 16px; }
.say b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; margin-bottom: 2px; }
.ref { margin: 0 0 26px; }
.ref h3 { font-size: 16px; margin: 0 0 2px; }
.ref .where { color: var(--muted); font-size: 13px; font-family: Consolas, "Cascadia Mono", monospace; }
.ref .what { margin: 6px 0 8px; }
.code { background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; overflow-x: auto; }
.code table { border-collapse: collapse; font: 13px/1.45 Consolas, "Cascadia Mono", "Courier New", monospace; min-width: 100%; }
.code td { padding: 0 10px; white-space: pre; vertical-align: top; }
.code td.n { color: var(--muted); text-align: right; user-select: none; border-right: 1px solid var(--line); width: 1%; }
.code tr.hl td { background: var(--hl); }
.code tr.mark td.n { color: var(--accent); font-weight: 700; }
.t-kw { color: var(--c-kw); } .t-str { color: var(--c-str); } .t-com { color: var(--c-com); font-style: italic; }
.t-sql { color: var(--c-sql); } .t-par { color: var(--c-par); font-weight: 600; } .t-num { color: var(--c-num); }
.t-sqlkw { color: var(--c-sql); font-weight: 700; }
ul.pts { list-style: none; margin: 8px 0 0; padding: 0; }
ul.pts li { display: flex; gap: 10px; padding: 5px 8px; border-radius: 4px; cursor: pointer; }
ul.pts li:hover, ul.pts li.on { background: var(--hl); }
ul.pts .ln-no { font-family: Consolas, monospace; color: var(--accent); font-weight: 700; min-width: 64px; }
.empty { color: var(--muted); font-size: 17px; margin-top: 40px; }
.nav { display: flex; gap: 8px; align-items: center; }
.pos { color: var(--muted); font-size: 13px; min-width: 60px; text-align: center; }
@media (max-width: 900px) {
  main { grid-template-columns: 1fr; height: auto; }
  #chart { border-right: 0; border-bottom: 1px solid var(--line); }
}
</style>

sole.WriteLine();\n\nif (customers.Count == 0)\n{\n    Console.WriteLine(\"  Inga kunder är registrerade än.\");\n}\nelse\n{\n    Console.WriteLine($\"  {\"Nr\",4}  {\"Namn\",-30}{\"E-post\",-34}Telefon\");\n    Console.WriteLine($\"  {new string('-', 82)}\");\n    foreach (var c in customers)\n    {\n        Console.WriteLine(\n            $\"  {c.Id,4}  {Shorten($\"{c.LastName}, {c.FirstName}\", 29),-30}{Shorten(c.Email, 33),-34}{c.Phone}\");\n    }\n}","file":"App.cs","from":100,"points":[{"line":106,"text":"Finns inga kunder sägs det tydligt."},{"line":114,"text":"En rad per kund."}],"title":"Utskriften","to":119,"what":"Listan skrivs ut i kolumner: nummer, namn, e-post, telefon."},{"code":"/// <summary>En kund i registret.<\/summary>\npublic record Customer(int Id, string FirstName, string LastName, string Email, string Phone)\n{\n    public string FullName => $\"{FirstName} {LastName}\";\n}","file":"Models.cs","from":3,"points":[],"title":"Dataklassen Customer","to":7,"what":"En kund i programmet. FullName sätter ihop för- och efternamn."}],"say":"Kunderna hämtas med en SELECT och skrivs ut som en tabell."},"c1b":{"name":"Välj kundnummer, eller 0 för ny kund","refs":[{"code":"Console.WriteLine();\nvar allowed = customers.Select(c => c.Id).Append(0).ToList();\nvar id = Input.ReadChoice(\n    \"Kundnummer (0 = registrera ny kund, Enter = tillbaka): \",\n    allowed,\n    \"  Det numret finns inte i listan. Skriv ett kundnummer, eller 0 för en ny kund.\");\n\nif (id is null) return;\n\nif (id == 0)\n{\n    await RegisterCustomerAsync();\n    return;\n}\n\n_current = customers.First(c => c.Id == id);\nConsole.WriteLine($\"  Vald kund: {_current.FullName}.\");","file":"App.cs","from":121,"points":[{"line":122,"text":"0 läggs till som tillåtet val och betyder ny kund."},{"line":128,"text":"Enter eller avbryt går tillbaka till menyn."}],"title":"Valet läses","to":137,"what":"Listan över tillåtna nummer byggs av kundernas id plus 0."},{"code":"public static int? ReadC (\"  En e-postadress ska ha formen namn@adress, utan mellanslag.\");\n    }\n}\n\nprivate static string? ReadPhone()\n{\n    while (true)\n    {\n        var phone = Input.ReadText(\"Telefon: \", 30);\n        if (phone is null) return null;\n\n        var looksRight = phone.Any(char.IsAsciiDigit)\n                         && phone.All(ch => char.IsAsciiDigit(ch) || ch is ' ' or '+' or '-' or '(' or ')');\n        if (looksRight) return phone;\n\n        Console.WriteLine(\"  Ett telefonnummer får bara innehålla siffror, mellanslag och tecknen + - ( ).\");\n    }\n}","file":"App.cs","from":172,"points":[{"line":182,"text":"Exakt ett @ i adressen."},{"line":197,"text":"Minst en siffra i telefonnumret."}],"title":"App.ReadEmail och ReadPhone – enkla kontroller","to":203,"what":"E-post ska ha ett @ och inga mellanslag. Telefon får bara ha siffror och några tecken."}],"say":"En ny kund registreras med namn och kontaktuppgifter. Uppgifterna kontrolleras innan de sparas med en INSERT."},"c1d":{"name":"Kunden är vald","refs":[{"code":"// Kunden som operatören just nu hjälper.\nprivate Customer? _current;","file":"App.cs","from":30,"points":[],"title":"Fältet _current","to":31,"what":"Här ligger den valda kunden så länge programmet kör. Frågetecknet betyder att den kan vara tom."},{"code":"_current = customers.First(c => c.Id == id);\nConsole.WriteLine($\"  Vald kund: {_current.FullName}.\");","file":"App.cs","from":136,"points":[],"title":"Kunden sparas","to":137,"what":"Efter valet läggs kunden i _current och namnet skrivs ut."}],"say":"Den valda kunden sparas i fältet _current. Val 3 till 6 gäller sedan den kunden."},"c2a":{"name":"Ort, incheckning, utcheckning, personer","refs":[{"code":"var cities = await _repo.GetCitiesAsync();\n\nConsole.WriteLine();\nConsole.WriteLine(\"SÖK LEDIGA RUM\");\nConsole.WriteLine();\nConsole.WriteLine(\"  Svara på frågorna, så visas de rum som är lediga under hela perioden.\");\nConsole.WriteLine(\"  Skriv \\\"avbryt\\\" för att gå tillbaka till menyn.\");\nConsole.WriteLine();\n\nif (cities.Count == 0)\n{\n    Console.WriteLine(\"  Det finns inga boenden i databasen. Kör sql/02_testdata.sql.\");\n    return null;\n}\n\n// Orterna visas först, så att operatören ser vad som går att välja.\nConsole.WriteLine(\"  Orter med boenden:\");\nfor (var i = 0; i < cities.Count; i++)\n    Console.WriteLine($\"    {i + 1}. {cities[i]}\");\nConsole.WriteLine();\n\nvar city = ReadCity(cities);\nif (city is null) return null;\n\nConsole.WriteLine($\"  Bokningsbar period: {FirstNight.ToString(DateFormat)} till {LastNight.ToString(DateFormat)}.\");\n\nvar checkIn = ReadCheckIn();\nif (checkIn is null) return null;\n\nvar checkOut = ReadCheckOut(checkIn.Value);\nif (checkOut is null) return null;\n\nvar guests = Input.ReadInt(\"Antal personer: \", 1, MaxGuestsInput);\nif (guests is null) return null;","file":"App.cs","from":235,"points":[{"line":235,"text":"Orterna hämtas ur databasen, så listan stämmer alltid."},{"line":256,"text":"Orten väljs med nummer eller namn."},{"line":264,"text":"Utcheckningen jämförs med incheckningen."},{"line":267,"text":"Minst 1 person."}],"title":"App.AskSearchCriteriaAsync – de obligatoriska frågorna","to":268,"what":"Först visas orterna som finns. Sedan frågas efter ort, datum och antal personer."},{"code":"private static string? ReadCity(List<string> cities)\n{\n    while (true)\n    {\n        var text = Input.ReadText(\"Ort (namn eller nummer i listan): \", 60);\n        if (text is null) return null;\n\n        if (int.TryParse(text, NumberStyles.None, CultureInfo.InvariantCulture, out var number))\n        {\n            if (number >= 1 && number <= cities.Count)\n                return cities[number - 1];\n\n            Console.WriteLine($\"  Listan har nummer 1 till {cities.Count}.\");\n            continue;\n        }\n\n        var match = cities.FirstOrDefault(c => string.Equals(c, text, StringComparison.CurrentCultureIgnoreCase));\n        if (match is not null)\n ing."},{"code":"// \"Alla rum kan bokas under december 2026.\" Första och sista natten\n// som går att boka. Eftersom utcheckningsdagen inte upptar rummet kan\n// utcheckningen som senast ske dagen efter den sista natten.\nprivate static readonly DateOnly FirstNight = new(2026, 12, 1);\nprivate static readonly DateOnly LastNight = new(2026, 12, 31);\nprivate static readonly DateOnly LatestCheckOut = LastNight.AddDays(1);","file":"App.cs","from":15,"points":[],"title":"Den bokningsbara perioden","to":20,"what":"Tre konstanter som bestämmer vilka datum som går att boka."},{"code":"public static DateOnly? ReadDate(string prompt)\n{\n    while (true)\n    {\n        var line = ReadLineOrCancel(prompt);\n        if (line is null) return null;\n\n        if (DateOnly.TryParseExact(line, \"yyyy-M-d\", CultureInfo.InvariantCulture, DateTimeStyles.None, out var date))\n            return date;\n\n        Console.WriteLine(\"  Skriv datumet som ÅÅÅÅ-MM-DD, till exempel 2026-12-10.\");\n    }\n}","file":"Input.cs","from":111,"points":[{"line":118,"text":"Try betyder att metoden svarar ja eller nej i stället för att krascha."}],"title":"Input.ReadDate – läs ett datum","to":123,"what":"Godtar bara formen ÅÅÅÅ-MM-DD. Omöjliga datum som 2026-12-32 ger en ny fråga."}],"say":"De fyra obligatoriska uppgifterna. Varje svar kontrolleras direkt, och fel svar ger en ny fråga."},"c2b":{"name":"Valfria filter","refs":[{"code":"Console.WriteLine();\nConsole.WriteLine(\"  Valfria filter. Tryck bara Enter för att hoppa över ett filter.\");\n\nvar pool = Input.ReadYesNo(\"Måste boendet ha pool? (j/n): \", defaultValue: false);\nif (pool is null) return null;\n\nvar restaurant = Input.ReadYesNo(\"Måste boendet ha restaurang? (j/n): \", defaultValue: false);\nif (restaurant is null) return null;\n\nif (!Input.TryReadOptionalInt(\"Högst antal meter till strand: \", 0, 1_000_000, out var maxBeach)) return null;\nif (!Input.TryReadOptionalInt(\"Högst antal meter till centrum: \", 0, 1_000_000, out var maxCenter)) return null;","file":"App.cs","from":270,"points":[{"line":273,"text":"Enter betyder nej, alltså inget krav."},{"line":279,"text":"Tom rad ger värdet null, som betyder inget filter."}],"title":"Frågorna om filter","to":280,"what":"Pool och restaurang är ja/nej. Avstånden är ett högsta antal meter, eller tomt."},{"code":"public static bool? ReadYesNo(string prompt, bool defaultValue)\n{\n    while (true)\n    {\n        var line = ReadLineOrCancel(prompt);\n        if (line is null) return null;\n\n        switch (line.ToLowerInvariant())\n        {\n            case \"\": return defaultValue;\n            case \"j\" or \"ja\": return true;\n            case \"n\" or \"nej\": return false;\n        }\n\n        Console.WriteLine(\"  Svara j för ja eller n för nej.\");\n    }\n}","file":"Input.cs","from":128,"points":[{"line":137,"text":"Tom rad ger standardsvaret."}],"title":"Input.ReadYesNo – ja eller nej","to":144,"what":"Godtar j, ja, n, nej eller Enter. Allt annat ger en ny fråga."},{"code":"public static bool TryReadOptionalInt(string prompt, int min, int max, out int? value,\n    string emptyMeans = \"för att hoppa över\")\n{\n    value = null;\n    while (true)\n    {\n        var line = ReadLineOrCancel(prompt);\n        if (line is null) return false;\n        if (line.Length == 0) return true;\n\n        if (TryParseDigits(line, out var number) && number >= min && number <= max)\n        {\n            value = number;\n            return true;\n        }\n\n        Console.WriteLine($\"  Skriv ett heltal mellan {min} och {max}, eller tryck bara Enter {emptyMeans}.\");\n    }\n}","file":"Input.cs","from":72,"points":[{"line":80,"text":"Tom rad: inget värde, men inget fel heller."}],"title":"Input.TryReadOptionalInt – ett valfritt tal","to":90,"what":"Ett tal som får lämnas tomt. Tomt blir null."}],"say":"De fyra filtren är valfria. Enter hoppar över ett filter, och då påverkar det inte sökningen."},"c2c":{"name":"Sortering","refs":[{"code":"Console.WriteLine();\nConsole.WriteLine(\"  Sortering: 1 = lägst pris först, 2 = högst omdöme först.\");\nif (!Input.TryReadOptionalInt(\"Sortering (Enter = 1): \", 1, 2, out var sort, \"för lägst pris först\")) return null;\n\nreturn new SearchCriteria(\n    city, checkIn.Value, checkOut.Value, guests.Value,\n    pool.Value, restaurant.Value, maxBeach, maxCenter,\n    sort == 2 ? SortOrder.RatingHighestFirst : SortOrder.PriceLowestFirst);","file":"App.cs","from":282,"points":[{"line":284,"text":"Enter ger lägst pris först."},{"line":289,"text":"Valet översätts till ett av två fasta värden. Fri text når aldrig SQL-frågan."}],"title":"Sorteringen väljs och villkoren samlas","to":289,"what":"Alla svar läggs i ett SearchCriteria-objekt som skickas till sökningen."},{"code":"/// <summary>Sökvillkoren som operatören matar in.<\/summary>\npublic record SearchCriteria(\n    string City,\n    DateOnly CheckIn,\n    DateOnly CheckOut,\n    int Guests,\n    bool RequirePool,\n    bool RequireRestaurant,\n    int? MaxBeachDistance,\n    int? MaxCenterDistance,\n    SortOrder Sort)\n{\n    public int Nights => CheckOut.DayNumber - CheckIn.DayNumber;\n}\n\n/// <summary>De två tillåtna sorteringarna. Fri text hamnar aldrig i ORDER BY.<\/summary>\npublic enum SortOrder\n{\n    PriceLowestFirst,\n    RatingHighestFirst\n}","file":"Models.cs","from":42,"points":[{"line":50,"text":"Frågetecknet betyder att värdet får saknas."},{"line":54,"text":"Antal nätter räknas ut från datumen."}],"title":"Dataklassen SearchCriteria och SortOrder","to":62,"what":"Allt som sökningen behöver, samlat i ett objekt."}],"say":"Operatören väljer 1 för lägst pris först eller 2 för högst omdöme först. Valet blir ett av två fasta värden."},"c2d":{"name":"SQL-frågan som hittar lediga rum","refs":[{"code":"const string sql = \"\"\"\n    SELECT  r.id,\n            a.name AS accommodation_name,\n            a.city,\n            r.room_number,\n            r.capacity,\n            r.price_per_night,\n            a.rating,\n            a.has_pool,\n            a.has_restaurant,\n            a.beach_distance_m,\n            a.center_distance_m\n      FROM  room r\n      JOIN  accommodation a ON a.id = r.accommodation_id\n     WHERE  a.city = @city\n       AND  r.capacity >= @guests\n       AND (@requirePool       = 0 OR a.has_pool       = 1)\n       AND (@requireRestaurant = 0 OR a.has_restaurant = 1)\n       AND (@maxBeach  IS NULL OR a.beach_distance_m  <= @maxBeach)\n       AND (@maxCenter IS NULL OR a.center_distance_m <= @maxCenter)\n       AND  NOT EXISTS (\n                SELECT 1\n                  FROM booking b\n                 WHERE b.room_id   = r.id\n                   AND b.check_in  < @checkOut\n                   AND b.check_out > @checkIn)\n     ORDER BY\n            CASE WHEN @sortByPrice = 1 THEN r.price_per_night END ASC,\n            CASE WHEN @sortByPrice = 0 THEN a.rating          END DESC,\n            r.price_per_night ASC,\n            a.name ASC,\n            r.room_number ASC;\n    \"\"\";","file":"Repository.cs","from":91,"points":[{"line":104,"text":"Rummet kopplas ihop med sitt boende, där ort, pool och omdöme står."},{"line":105,"text":"Rätt ort."},{"line":106,"text":"Rummet måste rymma sällskapet."},{"line":107,"text":"Valfritt filter: är filtret avstängt (0) släpps alla igenom, annars krävs pool."},{"line":109,"text":"Samma idé för avstånd: inget värde betyder inget filter."},{"line":111,"text":"Rummet tas bara med om det INTE finns någon bokning som krockar."},{"line":115,"text":"En bokning krockar om den börjar före den nya periodens slut ..."},{"line":116,"text":"... och slutar efter den nya periodens början. Strikt större än gör att utcheckningsdagen är ledig."},{"line":118,"text":"Sorteringen styrs av en siffra: 1 ger pris, 0 ger omdöme."}],"title":"SearchAvailableRoomsAsync – SQL-frågan","to":123,"what":"Ett rum kommer med om det ligger på rätt ort, rymmer sällskapet, klarar filtren och inte har någon bokning som krockar."},{"code":"             $\"{h.PricePerNight,9:N2}  {h.Rating,6}  {YesNo(h.HasPool),-5} {YesNo(h.HasRestaurant),-6} {h.BeachDistance,5} m  {h.CenterDistance,5} m\");\n    }\n\n    Console.WriteLine();\n    Console.WriteLine($\"  {Count(hits.Count, \"ledigt rum\", \"lediga rum\")}. Totalpris för vistelsen = {Count(c.Nights, \"natt\", \"nätter\")} x pris per natt.\");\n}","file":"App.cs","from":356,"points":[{"line":366,"text":"En sökning utan träffar säger det tydligt."},{"line":373,"text":"Kolumnrubrikerna. Rum-id är numret som används när man bokar."},{"line":380,"text":"N2 ger två decimaler och svenskt format."}],"title":"App.ShowHits – utskriften","to":385,"what":"Först en sammanfattning av sökningen, sedan en rad per ledigt rum."},{"code":"private static string DescribeFilters(SearchCriteria c)\n{\n    var parts = new List<string>();\n    if (c.RequirePool) parts.Add(\"pool\");\n    if (c.RequireRestaurant) parts.Add(\"restaurang\");\n    if (c.MaxBeachDistance is not null) parts.Add($\"högst {c.MaxBeachDistance} m till strand\");\n    if (c.MaxCenterDistance is not null) parts.Add($\"högst {c.MaxCenterDistance} m till centrum\");\n    return parts.Count == 0 ? \"inga\" : string.Join(\", \", parts);\n}","file":"App.cs","from":387,"points":[],"title":"App.DescribeFilters – vilka filter som gällde","to":395,"what":"Bygger en kort text av de filter som var påslagna."},{"code":"/// <summary>Ett ledigt rum som sökningen hittade.<\/summary>\npublic record RoomHit(\n    int RoomId,\n    string AccommodationName,\n    string City,\n    string RoomNumber,\n    int Capacity,\n    decimal PricePerNight,\n    int Rating,\n    bool HasPool,\n    bool HasRestaurant,\n    int BeachDistance,\n    int CenterDistance);","file":"Models.cs","from":9,"points":[],"title":"Dataklassen RoomHit","to":21,"what":"Ett ledigt rum så som sökningen lämnar det."}],"say":"Träffarna skrivs ut som en tabell med det uppgiften kräver: boendets namn, ort, rum, kapacitet och pris."},"c3a":{"name":"Kräver vald kund","refs":[{"code":"if (_current is null)\n{\n    Console.WriteLine(\"  Välj en kund först (val 1).\");\n    return;\n}","file":"App.cs","from":402,"points":[],"title":"Kontrollen","to":406,"what":"Är _current tom skrivs ett meddelande och metoden avslutas."}],"say":"En bokning gäller alltid en kund. Är ingen vald får operatören veta det och kommer tillbaka till menyn."},"c3b":{"name":"Sökningen körs om mot databasen","refs":[{"code":"SearchCriteria? criteria = null;\n\nif (_lastSearch is not null)\n{\n    var s = _lastSearch;\n    Console.WriteLine();\n    Console.WriteLine($\"  Senaste sökningen: {s.City}, {s.CheckIn.ToString(DateFormat)} till {s.CheckOut.ToString(DateFormat)}, {Count(s.Guests, \"person\", \"personer\")}.\");\n\n    var reuse = Input.ReadYesNo(\"Boka ett rum från den sökningen? (j/n, Enter = j): \", defaultValue: true);\n    if (reuse is null) return;\n    if (reuse.Value) criteria = s;\n}\nelse\n{\n    Console.WriteLine();\n    Console.WriteLine(\"  Ingen sökning är gjord än, så vi börjar med att söka fram ett ledigt rum.\");\n}\n\ncriteria ??= await AskSearchCriteriaAsync();\nif (criteria is null) return;\n\n// Sökningen körs alltid om mot databasen. Listan visar därför vad\n// som är ledigt just nu, inte vad som var ledigt vid förra sökningen.\nvar hits = await _repo.SearchAvailableRoomsAsync(criteria);\nShowHits(hits, criteria);\n\nif (hits.Count == 0)\n{\n    _lastSearch = null;\n    return;\n}\n_lastSearch = criteria;","file":"App.cs","from":408,"points":[{"line":416,"text":"Enter betyder ja, så att ort och datum inte behöver skrivas igen."},{"line":426,"text":"??= betyder: om inget är valt än, fråga nu."},{"line":431,"text":"Samma SQL-fråga som i val 2 körs en gång till."}],"title":"Senaste sökningen återanvänds","to":439,"what":"Finns en tidigare sökning erbjuds den. Annars ställs sökfrågorna först."}],"say":"Listan som operatören bokar från är alltid färsk. Den visar vad som är ledigt nu, inte vid förra sökningen."},"c3c":{"name":"Välj rum ur listan","refs":[{"code":"Console.WriteLine();\nvar roomId = Input.ReadChoice(\n    $\"Rum-id att boka åt {_current.FullName} (Enter = avbryt): \",\n    hits.Select(h => h.RoomId).ToList(),\n    \"  Skriv ett rum-id ur listan ovan, eller tryck bara Enter för att avbryta.\");\n\nif (roomId is null)\n{\n    Console.WriteLine(\"  Ingen bokning gjord.\");\n    return;\n}\n\nvar room = hits.First(h => h.RoomId == roomId);","file":"App.cs","from":441,"points":[{"line":444,"text":"Listan över tillåtna rum-id byggs av sökresultatet."},{"line":447,"text":"Enter avbryter utan att boka."}],"title":"Rummet väljs","to":453,"what":"De tillåtna numren är rum-id för träffarna i listan."},{"code":"public static int? ReadChoice(string prompt, IReadOnlyCollection<int> allowed, string errorMessage)\n{\n    while (true)\n    {\n        var line = ReadLineOrCancel(prompt);\n        if (string.IsNullOrEmpty(line)) return null;\n\n        if (TryParseDigits(line, out var value) && allowed.Contains(value))\n            return value;\n\n        Console.WriteLine(errorMessage);\n    }\n}","file":"Input.cs","from":96,"points":[],"title":"Input.ReadChoice – välj ur en lista","to":108,"what":"Samma hjälpmetod som när kunden väljs."}],"say":"Operatören skriver ett rum-id ur listan. Bara rum som just visades som lediga går att välja."},"c3d":{"name":"Transaktion: lås rummet och kontrollera igen","refs":[{"code":"public async Task<BookingResult> CreateBookingAsync(\n    int roomId, int customerId, DateOnly checkIn, DateOnly checkOut, int guests)\n{\n    await using var conn = await _db.OpenAsync();\n    await using var tx = await conn.BeginTransactionAsync();\n\n    const string lockSql = \"\"\"\n        SELECT capacity, price_per_night\n          FROM room\n         WHERE id = @roomId\n           FOR UPDATE;\n        \"\"\";\n\n    int capacity;\n    decimal price;\n\n    await using (var lockCmd = new MySqlCommand(lockSql, conn, tx))\n    {\n        lockCmd.Parameters.AddWithValue(\"@roomId\", roomId);\n        await lockCmd.PrepareAsync();\n\n        await using var reader = await lockCmd.ExecuteReaderAsync();\n        if (!await reader.ReadAsync())\n        {\n            await reader.CloseAsync();\n            await tx.RollbackAsync();\n            return new BookingResult(BookingOutcome.RoomMissing);\n        }\n        capacity = reader.GetInt32(\"capacity\");\n        price = reader.GetDecimal(\"price_per_night\");\n    }","file":"Repository.cs","from":192,"points":[{"line":196,"text":"Transaktionen börjar."},{"line":202,"text":"Låser rummets rad tills transaktionen är klar."},{"line":218,"text":"Finns rummet inte avbryts allt."},{"line":220,"text":"Kapacitet och pris läses för kontrollen och totalpriset."}],"title":"CreateBookingAsync – transaktionen startar och rummet låses","to":222,"what":"En transaktion gör att allt sparas eller inget. Rummets rad låses så att ingen annan kan boka samma rum samtidigt."},{"code":"if (guests > capacity)\n{\n    await tx.RollbackAsync();\n    return new BookingResult(BookingOutcome.TooManyGuests);\n}","file":"Repository.cs","from":224,"points":[{"line":226,"text":"Rollback betyder: ångra allt i transaktionen."}],"title":"Kapaciteten kontrolleras","to":228,"what":"Är sällskapet för stort rullas transaktionen tillbaka och inget sparas."},{"code":"const string conflictSql = \"\"\"\n    SELECT COUNT(*)\n      FROM booking\n     WHERE room_id   = @roomId\n       AND check_in  < @checkOut\n       AND check_out > @checkIn;\n    \"\"\";\n\nawait using (var conflictCmd = new MySqlCommand(conflictSql, conn, tx))\n{\n    conflictCmd.Parameters.AddWithValue(\"@roomId\", roomId);\n    conflictCmd.Parameters.AddWithValue(\"@checkIn\", ToDb(checkIn));\n    conflictCmd.Parameters.AddWithValue(\"@checkOut\", ToDb(checkOut));\n    await conflictCmd.PrepareAsync();\n\n    var conflicts = Convert.ToInt32(await conflictCmd.ExecuteScalarAsync());\n    if (conflicts > 0)\n    {\n        await tx.RollbackAsync();\n        return new BookingResult(BookingOutcome.RoomTaken);\n    }\n}","file":"Repository.cs","from":230,"points":[{"line":234,"text":"Samma villkor som i sökningen."},{"line":246,"text":"Minst en krock: rummet har hunnit bli bokat."},{"line":249,"text":"Svaret som gör att operatören får veta att rummet är upptaget."}],"title":"Tillgängligheten kontrolleras igen","to":251,"what":"Samma krockvillkor som i sökningen. Finns en krock sparas ingenting."}],"say":"Uppgiften kräver att tillgängligheten kontrolleras en gång till när bokningen sparas. Det görs här, i en transaktion."},"c3e":{"name":"Bokningen sparas och bekräftas","refs":[{"code":"const string insertSql = \"\"\"\n    INSERT INTO booking (room_id, customer_id, check_in, check_out, guests)\n    VALUES (@roomId, @customerId, @checkIn, @checkOut, @guests);\n    \"\"\";\n\nint newId;\nawait using (var insertCmd = new MySqlCommand(insertSql, conn, tx))\n{\n    insertCmd.Parameters.AddWithValue(\"@roomId\", roomId);\n    insertCmd.Parameters.AddWithValue(\"@customerId\", customerId);\n    insertCmd.Parameters.AddWithValue(\"@checkIn\", ToDb(checkIn));\n    insertCmd.Parameters.AddWithValue(\"@checkOut\", ToDb(checkOut));\n    insertCmd.Parameters.AddWithValue(\"@guests\", guests);\n    await insertCmd.PrepareAsync();\n    await insertCmd.ExecuteNonQueryAsync();\n    newId = (int)insertCmd.LastInsertedId;\n}\n\nawait tx.CommitAsync();\n\n// Totalpris = antal nätter × pris per natt.\nvar nights = checkOut.DayNumber - checkIn.DayNumber;\nreturn new BookingResult(BookingOutcome.Created, newId, nights, price, nights * price);","file":"Repository.cs","from":253,"points":[{"line":254,"text":"Rum, kund, datum och antal personer sparas."},{"line":268,"text":"Bokningsnumret som databasen gav."},{"line":271,"text":"Commit gör ändringen permanent."},{"line":274,"text":"10–13 december blir 3 nätter."},{"line":275,"text":"Totalpris = nätter × pris per natt."}],"title":"Bokningen sparas","to":275,"what":"En INSERT med parametrar, sedan Commit. Efter det räknas totalpriset ut."},{"code":"Console.WriteLine();\nswitch (result.Outcome)\n{\n    case BookingOutcome.Created:\n        Console.WriteLine(\"  BOKNINGSBEKRÄFTELSE\");\n        Console.WriteLine($\"    Bokningsnummer : {result.BookingId}\");\n        Console.WriteLine($\"    Kund           : {_current.FullName}\");\n        Console.WriteLine($\"    Boende         : {room.AccommodationName}, {room.City}\");\n        Console.WriteLine($\"    Rum            : {room.RoomNumber}\");\n        Console.WriteLine($\"    Incheckning    : {criteria.CheckIn.ToString(DateFormat)}\");\n        Console.WriteLine($\"    Utcheckning    : {criteria.CheckOut.ToString(DateFormat)}\");\n        Console.WriteLine($\"    Antal personer : {criteria.Guests}\");\n        Console.WriteLine($\"    Totalpris      : {Count(result.Nights, \"natt\", \"nätter\")} x {result.PricePerNight:N2} kr = {result.Total:N2} kr\");\n        break;\n\n    case BookingOutcome.RoomTaken:\n        Console.WriteLine(\"  Rummet har hunnit bli bokat sedan sökningen gjordes.\");\n        Console.WriteLine(\"  Ingen bokning gjord. Välj 3 igen för att se vad som är ledigt nu.\");\n        break;\n\n    case BookingOutcome.TooManyGuests:\n        Console.WriteLine(\"  Sällskapet ryms inte i rummet. Ingen bokning gjord.\");\n        break;\n\n    case BookingOutcome.RoomMissing:\n        Console.WriteLine(\"  Rummet finns inte längre. Ingen bokning gjord.\");\n        break;\n}","file":"App.cs","from":460,"points":[{"line":465,"text":"Bokningsnumret visas."},{"line":472,"text":"Uträkningen visas: nätter x pris = total."},{"line":475,"text":"Rummet hann bli bokat av någon annan."},{"line":480,"text":"Sällskapet ryms inte."}],"title":"Bekräftelsen eller beskedet","to":487,"what":"Fyra möjliga utfall. Bara det första betyder att en bokning gjordes."},{"code":"/// <summary>Utfallet av ett försök att boka.<\/summary>\npublic enum BookingOutcome\n{\n    Created,\n    RoomTaken,\n    TooManyGuests,\n    RoomMissing\n}\n\n (\n            reader.GetInt32(\"id\"),\n            reader.GetString(\"accommodation_name\"),\n            reader.GetString(\"city\"),\n            reader.GetString(\"room_number\"),\n            reader.GetInt32(\"capacity\"),\n            DateOnly.FromDateTime(reader.GetDateTime(\"check_in\")),\n            DateOnly.FromDateTime(reader.GetDateTime(\"check_out\")),\n            reader.GetInt32(\"guests\"),\n            reader.GetDecimal(\"price_per_night\")));\n    }\n    return list;\n}","file":"Repository.cs","from":281,"points":[{"line":294,"text":"Bokningen kopplas till sitt rum ..."},{"line":295,"text":"... och rummet till sitt boende. Det är relationerna i E/R-diagrammet."},{"line":296,"text":"Bara den här kundens bokningar."},{"line":292,"text":"Priset hämtas från rummet. Totalpriset lagras inte, det räknas ut."},{"line":316,"text":"Datumet görs om till en ren datumtyp i C#."}],"title":"Repository.GetBookingsForCustomerAsync","to":322,"what":"Hämtar kundens bokningar, sorterade på incheckning."}],"say":"En SELECT som kopplar ihop tre tabeller: bokning, rum och boende. Kundnumret skickas som parameter."},"c4c":{"name":"Listan över bokningar","refs":[{"code":"private static void ShowBookingRows(List<BookingRow> rows, Customer customer)\n{\n    Console.WriteLine();\n    Console.WriteLine($\"BOKNINGAR FÖR {customer.FullName.ToUpper(CultureInfo.CurrentCulture)}\");\n    Console.WriteLine();\n\n    if (rows.Count == 0)\n    {\n        Console.WriteLine(\"  Kunden har inga bokningar.\");\n        return;\n    }\n\n    Console.WriteLine(\n        $\"  {\"Nr\",6}  {\"Boende\",-26} {\"Ort\",-11} {\"Rum\",-6} {\"Incheckning\",-13}{\"Utcheckning\",-13}{\"Nätter\",6}  {\"Pers\",4}  {\"Totalpris\",13}\");\n    Console.WriteLine($\"  {new string('-', 107)}\");\n\n    foreach (var b in rows)\n    {\n        Console.WriteLine(\n            $\"  {b.BookingId,6}  {Shorten(b.AccommodationName, 25),-26} {Shorten(b.City, 10),-11} {b.RoomNumber,-6} \" +\n            $\"{b.CheckIn. c();\n    return GuestUpdateOutcome.Updated;\n}","file":"Repository.cs","from":332,"points":[{"line":340,"text":"Kapaciteten hämtas från bokningens rum."},{"line":342,"text":"Raden låses under kontrollen."},{"line":355,"text":"Finns bokningen inte avbryts allt."},{"line":360,"text":"För många personer: ingenting ändras."},{"line":368,"text":"Det nya antalet sparas."},{"line":380,"text":"Ändringen görs permanent."}],"title":"Repository.UpdateGuestsAsync","to":382,"what":"Kontrollen och ändringen görs i samma transaktion."},{"code":"// Det är databasen som avgör om sällskapet ryms, inte den här klassen.\nvar outcome = await _repo.UpdateGuestsAsync(booking.BookingId, guests.Value);\n\nswitch (outcome)\n{\n    case GuestUpdateOutcome.Updated:\n        Console.WriteLine($\"  Bokning {booking.BookingId} gäller nu {Count(guests.Value, \"person\", \"personer\")}.\");\n        break;\n\n    case GuestUpdateOutcome.TooManyGuests:\n        Console.WriteLine($\"  Går inte: rum {booking.RoomNumber} tar högst {Count(booking.Capacity, \"person\", \"personer\")}. Bokningen är oförändrad.\");\n        break;\n\n    case GuestUpdateOutcome.BookingMissing:\n        Console.WriteLine(\"  Bokningen finns inte längre.\");\n        break;\n}","file":"App.cs","from":575,"points":[{"line":580,"text":"Ändringen gick igenom."},{"line":584,"text":"Nekas, och bokningen är oförändrad."}],"title":"Utfallet visas","to":591,"what":"Tre möjliga besked till operatören."},{"code":"/// <summary>Utfallet av ett försök att ändra antal personer.<\/summary>\npublic enum GuestUpdateOutcome\n{\n    Updated,\n    TooManyGuests,\n    BookingMissing\n}","file":"Models.cs","from":81,"points":[],"title":"GuestUpdateOutcome","to":87,"what":"De tre möjliga svaren från Repository."}],"say":"Rummets kapacitet läses ur databasen och jämförs. Ryms sällskapet görs en UPDATE, annars ändras ingenting."},"c6a":{"name":"Välj bokning ur kundens lista","refs":[{"code":"private async Task<BookingRow?> PickBookingAsync(string p     while ((m = re.exec(text))) {
      if (m[1]) out.push(['t-par', m[1]]);
      else if (m[2]) out.push([SQLKW.indexOf(m[2]) >= 0 ? 't-sqlkw' : 't-sql', m[2]]);
      else out.push(['t-sql', m[3]]);
    }
  }

  // Delar koden i bitar: [klass, text]
  function tokens(code) {
    var out = [], i = 0, n = code.length;
    while (i < n) {
      var rest = code.slice(i), m;
      if (rest.slice(0, 3) === '"""') {
        var end = code.indexOf('"""', i + 3);
        end = end < 0 ? n : end + 3;
        out.push(['t-str', '"""']);
        sqlTokens(code.slice(i + 3, end - 3), out);
        out.push(['t-str', '"""']);
        i = end; continue;
      }
      if (rest.slice(0, 2) === '//') {
        var nl = code.indexOf('\n', i); nl = nl < 0 ? n : nl;
        out.push(['t-com', code.slice(i, nl)]); i = nl; continue;
      }
      if ((m = /^\$?"(?:[^"\\\n]|\\.)*"/.exec(rest))) { out.push(['t-str', m[0]]); i += m[0].length; continue; }
      if ((m = /^'(?:[^'\\\n]|\\.)'/.exec(rest))) { out.push(['t-str', m[0]]); i += m[0].length; continue; }
      if ((m = /^[A-Za-z_][A-Za-z0-9_]*/.exec(rest))) { out.push([KW.indexOf(m[0]) >= 0 ? 't-kw' : '', m[0]]); i += m[0].length; continue; }
      if ((m = /^[0-9][0-9_]*/.exec(rest))) { out.push(['t-num', m[0]]); i += m[0].length; continue; }
      out.push(['', code[i]]); i++;
    }
    return out;
  }

  // Gör om bitarna till en HTML-sträng per rad
  function highlightLines(code) {
    var lines = [''], toks = tokens(code);
    toks.forEach(function (t) {
      var parts = t[1].split('\n');
      parts.forEach(function (p, k) {
        if (k > 0) lines.push('');
        if (p.length) lines[lines.length - 1] += t[0] ? '<span class="' + t[0] + '">' + esc(p) + '</span>' : esc(p);
      });
    });
    return lines;
  }

  function render(idx) {
    var id = DATA.order[idx], node = DATA.nodes[id];
    current = idx;
    document.querySelectorAll('.node.sel').forEach(function (e) { e.classList.remove('sel'); });
    var g = document.querySelector('.node[data-id="' + id + '"]');
    if (g) g.classList.add('sel');
    document.getElementById('pos').textContent = (idx + 1) + ' / ' + DATA.order.length;

    var h = '<h2>' + esc(node.name) + '</h2>';
    h += '<div class="say"><b>Enkelt förklarat</b>' + esc(node.say) + '</div>';
    node.refs.forEach(function (r, ri) {
      var marked = {};
      r.points.forEach(function (p) { marked[p.line] = true; });
      h += '<div class="ref" data-ref="' + ri + '"><h3>' + esc(r.title) + '</h3>';
      h += '<div class="where">' + esc(r.file) + ', rad ' + r.from + (r.to > r.from ? '–' + r.to : '') + '</div>';
      h += '<p class="what">' + esc(r.what) + '</p>';
      h += '<div class="code"><table>';
      highlightLines(r.code).forEach(function (ln, k) {
        var no = r.from + k;
        h += '<tr data-line="' + no + '"' + (marked[no] ? ' class="mark"' : '') + '><td class="n">' + no + '</td><td>' + (ln || ' ') + '</td></tr>';
      });
      h += '</table></div>';
      if (r.points.length) {
        h += '<ul class="pts">';
        r.points.forEach(function (p) {
          h += '<li data-line="' + p.line + '" tabindex="0"><span class="ln-no">Rad ' + p.line + '</span><span>' + esc(p.text) + '</span></li>';
        });
        h += '</ul>';
      }
      h += '</div>';
    });
    panel.innerHTML = h;
    panel.scrollTop = 0;
    try { history.replaceState(null, '', '#' + id); } catch (e) {}
  }

  function point(li) {
    var ref = li.closest('.ref'), line = li.getAttribute('data-line');
    ref.querySelectorAll('tr.hl').forEach(function (e) { e.classList.remove('hl'); });
    ref.querySelectorAll('li.on').forEach(function (e) { e.classList.remove('on'); });
    var tr = ref.querySelector('tr[data-line="' + line + '"]');
    if (tr) { tr.classList.add('hl'); tr.scrollIntoView({ block: 'nearest' }); }
    li.classList.add('on');
  }

  function step(d) {
    var n = DATA.order.length;
    render(current < 0 ? 0 : (current + d + n) % n);
  }

  document.querySelectorAll('.node').forEach(function (g) {
    function go() { render(DATA.order.indexOf(g.getAttribute('data-id'))); }
    g.addEventListener('click', go);
    g.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
  });
  panel.addEventListener('click', function (e) { var li = e.target.closest('ul.pts li'); if (li) point(li); });
  panel.addEventListener('mouseover', function (e) { var li = e.target.closest('ul.pts li'); if (li) point(li); });
  panel.addEventListener('keydown', function (e) { var li = e.target.closest('ul.pts li'); if (li && e.key === 'Enter') point(li); });
  document.getElementById('prev').addEventListener('click', function () { step(-1); });
  document.getElementById('next').addEventListener('click', function () { step(1); });
  document.addEventListener('keydown', function (e) {
    if (e.target.closest && e.target.closest('.node, ul.pts li')) return;
    if (e.key === 'ArrowRight') step(1);
    if (e.key === 'ArrowLeft') step(-1);
  });
  document.getElementById('theme').addEventListener('click', function () {
    var root = document.documentElement, dark = root.getAttribute('data-theme');
    if (!dark) dark = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    root.setAttribute('data-theme', dark === 'dark' ? 'light' : 'dark');
  });

  var start = DATA.order.indexOf(location.hash.slice(1));
  if (start >= 0) render(start);
})();
</script>
</body>
</html>
